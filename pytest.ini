[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The default suite is hermetic: no Ollama, Redis, Celery, network or API
# keys, and no dependency on a populated corpus. Anything that needs a live
# service must be marked `integration` and is deselected by default.
addopts = -q --strict-markers -m "not integration"

markers =
    integration: requires a live service (Ollama, Redis, Celery or a populated database)

filterwarnings =
    ignore::DeprecationWarning
